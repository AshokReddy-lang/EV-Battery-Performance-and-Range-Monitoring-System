<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>{% block title %}EV Intelligence{% endblock %}</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Exo+2:wght@300;400;500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════
   DESIGN TOKENS
═══════════════════════════════════════════ */
:root{
  --bg:#03080f; --s1:#071220; --s2:#0c1e35; --s3:#122640;
  --c1:#00d4ff; --c2:#00ff88; --c3:#ff6b35; --c4:#ffd700; --c5:#bf5fff;
  --txt:#b8d4e8; --txtd:#3a6a8a;
  --bdr:rgba(0,212,255,0.12);
  --glow1:0 0 24px rgba(0,212,255,0.25);
  --glow2:0 0 24px rgba(0,255,136,0.25);
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--txt);font-family:'Exo 2',sans-serif;min-height:100vh;overflow-x:hidden;}

/* BACKGROUND */
.bg-layer{position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 80% 50% at 10% 0%,rgba(0,212,255,.05),transparent 60%),
    radial-gradient(ellipse 60% 40% at 90% 100%,rgba(0,255,136,.04),transparent 60%),
    linear-gradient(rgba(0,212,255,.025) 1px,transparent 1px) 0 0/48px 48px,
    linear-gradient(90deg,rgba(0,212,255,.025) 1px,transparent 1px) 0 0/48px 48px;
}
.scan{position:fixed;inset:0;pointer-events:none;z-index:999;
  background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.012) 3px,rgba(0,0,0,.012) 4px);}

/* HEADER */
header{position:sticky;top:0;z-index:100;background:rgba(3,8,15,.95);backdrop-filter:blur(24px);border-bottom:1px solid var(--bdr);}
.hdr{max-width:1440px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 40px;height:68px;}
.logo{display:flex;align-items:center;gap:14px;text-decoration:none;}
.logo-mark{width:42px;height:42px;background:linear-gradient(135deg,var(--c1),var(--c2));
  clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);
  display:flex;align-items:center;justify-content:center;
  font-family:'Share Tech Mono',monospace;font-size:.68rem;color:#000;font-weight:700;}
.logo-txt{font-family:'Rajdhani',sans-serif;font-size:1.45rem;font-weight:700;color:#fff;letter-spacing:3px;text-transform:uppercase;}
.logo-txt span{color:var(--c1);}
.logo-sub{font-family:'Share Tech Mono',monospace;font-size:.58rem;color:var(--txtd);letter-spacing:3px;margin-top:2px;}

/* NAV */
nav{display:flex;gap:4px;}
.nav-a{font-family:'Share Tech Mono',monospace;font-size:.68rem;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--txtd);background:none;border:1px solid transparent;
  padding:8px 18px;border-radius:3px;cursor:pointer;transition:all .25s;text-decoration:none;display:inline-block;position:relative;}
.nav-a:hover,.nav-a.active{color:var(--c1);border-color:var(--bdr);background:rgba(0,212,255,.06);}
.nav-a.active::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--c1),transparent);}

/* LIVE BADGE */
.live-pill{display:flex;align-items:center;gap:7px;font-family:'Share Tech Mono',monospace;font-size:.62rem;
  letter-spacing:2px;color:var(--c2);background:rgba(0,255,136,.07);border:1px solid rgba(0,255,136,.2);padding:5px 14px;border-radius:2px;}
.dot{width:7px;height:7px;border-radius:50%;background:var(--c2);animation:blink 2s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}

/* MAIN */
main{position:relative;z-index:1;max-width:1440px;margin:0 auto;padding:36px 40px 60px;}

/* SECTION HEADER */
.sec-hdr{display:flex;align-items:center;gap:16px;margin-bottom:28px;}
.sec-title{font-family:'Rajdhani',sans-serif;font-size:1.1rem;font-weight:700;letter-spacing:4px;color:#fff;text-transform:uppercase;white-space:nowrap;}
.sec-line{flex:1;height:1px;background:linear-gradient(90deg,var(--bdr),transparent);}
.sec-tag{font-family:'Share Tech Mono',monospace;font-size:.6rem;letter-spacing:2px;color:var(--c1);
  background:rgba(0,212,255,.07);border:1px solid rgba(0,212,255,.2);padding:3px 10px;white-space:nowrap;}

/* CARD */
.card{background:var(--s1);border:1px solid var(--bdr);border-radius:6px;overflow:hidden;position:relative;transition:transform .3s,box-shadow .3s;}
.card:hover{transform:translateY(-3px);box-shadow:var(--glow1);}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--c1),var(--c2),transparent);opacity:.6;}
.card-hdr{padding:14px 22px;border-bottom:1px solid var(--bdr);background:var(--s2);
  font-family:'Share Tech Mono',monospace;font-size:.7rem;letter-spacing:2px;color:var(--c1);text-transform:uppercase;
  display:flex;align-items:center;justify-content:space-between;}
.card-body{padding:24px 22px;}

/* BUTTONS */
.btn{font-family:'Rajdhani',sans-serif;font-size:.85rem;font-weight:700;letter-spacing:3px;text-transform:uppercase;
  padding:13px 30px;border-radius:3px;cursor:pointer;border:none;transition:all .3s;display:inline-flex;align-items:center;gap:8px;text-decoration:none;}
.btn-p{background:linear-gradient(135deg,var(--c1),#0099cc);color:#000;}
.btn-p:hover{box-shadow:0 0 30px rgba(0,212,255,.5);transform:translateY(-2px);}
.btn-g{background:transparent;color:var(--c2);border:1px solid var(--c2);}
.btn-g:hover{background:rgba(0,255,136,.07);transform:translateY(-2px);}
.btn-o{background:transparent;color:var(--c3);border:1px solid var(--c3);}
.btn-o:hover{background:rgba(255,107,53,.07);transform:translateY(-2px);}
.btn-sm{padding:8px 18px;font-size:.72rem;letter-spacing:2px;}

/* BADGES */
.bdg{display:inline-block;padding:2px 9px;border-radius:2px;font-size:.6rem;letter-spacing:1px;font-family:'Share Tech Mono',monospace;}
.bdg-g{background:rgba(0,255,136,.12);color:var(--c2);border:1px solid rgba(0,255,136,.25);}
.bdg-b{background:rgba(0,212,255,.1);color:var(--c1);border:1px solid rgba(0,212,255,.2);}
.bdg-o{background:rgba(255,107,53,.1);color:var(--c3);border:1px solid rgba(255,107,53,.2);}
.bdg-y{background:rgba(255,215,0,.1);color:var(--c4);border:1px solid rgba(255,215,0,.2);}
.bdg-p{background:rgba(191,95,255,.1);color:var(--c5);border:1px solid rgba(191,95,255,.2);}

/* TABLEAU */
.tab-wrap{background:var(--s1);border:1px solid var(--bdr);border-radius:8px;overflow:hidden;}
.tab-bar{padding:14px 22px;background:var(--s2);border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between;}
.tab-info{font-family:'Share Tech Mono',monospace;font-size:.7rem;letter-spacing:1.5px;color:var(--txt);display:flex;align-items:center;gap:10px;}
.tab-info::before{content:'';width:9px;height:9px;border-radius:50%;background:var(--c2);animation:blink 2s infinite;}
.win-dots{display:flex;gap:7px;}
.wd{width:13px;height:13px;border-radius:50%;}
.tab-footer{padding:10px 22px;border-top:1px solid var(--bdr);font-family:'Share Tech Mono',monospace;font-size:.62rem;color:var(--txtd);letter-spacing:1.5px;text-align:center;}

/* FORMS */
.form-grp{margin-bottom:22px;}
.f-label{font-family:'Share Tech Mono',monospace;font-size:.65rem;letter-spacing:2px;color:var(--txtd);text-transform:uppercase;
  margin-bottom:9px;display:flex;justify-content:space-between;align-items:center;}
.f-label .val{color:var(--c1);font-size:.82rem;font-family:'Rajdhani',monospace;font-weight:600;}
input[type=range]{width:100%;-webkit-appearance:none;height:3px;background:var(--s3);border-radius:2px;outline:none;border:none;cursor:pointer;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--c1);
  cursor:pointer;box-shadow:0 0 10px rgba(0,212,255,.7);border:2px solid var(--bg);}
.tick-row{display:flex;justify-content:space-between;margin-top:5px;font-family:'Share Tech Mono',monospace;font-size:.58rem;color:var(--txtd);}
select{width:100%;background:var(--s2);border:1px solid var(--bdr);color:var(--txt);padding:11px 14px;border-radius:4px;
  font-family:'Share Tech Mono',monospace;font-size:.72rem;outline:none;cursor:pointer;transition:border-color .3s;}
select:focus{border-color:var(--c1);}
select option{background:var(--s2);}
.run-btn{width:100%;background:linear-gradient(135deg,rgba(0,212,255,.9),rgba(0,153,204,.9));color:#000;border:none;
  padding:15px;font-family:'Rajdhani',sans-serif;font-size:.9rem;font-weight:700;letter-spacing:4px;text-transform:uppercase;
  border-radius:4px;cursor:pointer;transition:all .3s;overflow:hidden;position:relative;}
.run-btn:hover{box-shadow:0 0 28px rgba(0,212,255,.5);transform:translateY(-2px);}
.run-btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}

/* TABLE */
.ev-tbl{width:100%;border-collapse:collapse;font-size:.78rem;}
.ev-tbl th{font-family:'Share Tech Mono',monospace;font-size:.6rem;letter-spacing:2px;color:var(--txtd);text-transform:uppercase;
  padding:13px 14px;text-align:left;border-bottom:1px solid var(--bdr);background:var(--s2);}
.ev-tbl td{padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.03);font-family:'Share Tech Mono',monospace;font-size:.72rem;transition:background .2s;}
.ev-tbl tr:hover td{background:rgba(0,212,255,.03);}

/* SPINNER */
.spinner-wrap{display:none;justify-content:center;align-items:center;gap:12px;padding:18px;
  font-family:'Share Tech Mono',monospace;font-size:.72rem;letter-spacing:2px;color:var(--txtd);}
.spinner{width:18px;height:18px;border:2px solid var(--bdr);border-top-color:var(--c1);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}

/* ANIMATIONS */
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.fade-up{animation:fadeUp .5s ease both;}
@keyframes slideDown{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

/* MISC */
.info-note{font-family:'Share Tech Mono',monospace;font-size:.62rem;color:var(--txtd);text-align:center;padding:10px;border-top:1px solid var(--bdr);letter-spacing:1.5px;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:22px;}
.chart-tall{height:340px;padding:16px;}
.chart-tall canvas{width:100%!important;height:100%!important;}

/* API route display */
.route-pill{display:inline-flex;align-items:center;gap:8px;font-family:'Share Tech Mono',monospace;font-size:.65rem;
  letter-spacing:1px;color:var(--c2);background:rgba(0,255,136,.07);border:1px solid rgba(0,255,136,.2);
  padding:5px 14px;border-radius:3px;margin:3px;}
.method{color:#000;background:var(--c1);padding:2px 6px;border-radius:2px;font-size:.6rem;font-weight:700;}
.method.post{background:var(--c2);}
.method.get{background:var(--c1);}

/* SCROLLBAR */
::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--s3);border-radius:3px;}

/* RESPONSIVE */
@media(max-width:900px){main{padding:20px;}nav{display:none;}.hdr{padding:0 20px;}.grid-2{grid-template-columns:1fr;}}
</style>
{% block extra_head %}{% endblock %}
</head>
<body>
<div class="bg-layer"></div>
<div class="scan"></div>

<header>
  <div class="hdr">
    <a href="/" class="logo">
      <div class="logo-mark">EV</div>
      <div>
        <div class="logo-txt">EV<span>Intelligence</span></div>
        <div class="logo-sub">Battery · Range · Market Analysis</div>
      </div>
    </a>
    <nav>
      <a href="/"           class="nav-a {% block nav_home %}{% endblock %}">Overview</a>
      <a href="/dashboard"  class="nav-a {% block nav_dash %}{% endblock %}">EV Dashboard</a>
      <a href="/story"      class="nav-a {% block nav_story %}{% endblock %}">India Story</a>
      <a href="/predictor"  class="nav-a {% block nav_pred %}{% endblock %}">ML Predictor</a>
      <a href="/insights"   class="nav-a {% block nav_ins %}{% endblock %}">ML Insights</a>
      <a href="/analysis"   class="nav-a {% block nav_anal %}{% endblock %}">Analysis</a>
    </nav>
    <div style="display:flex;align-items:center;gap:10px;">
      <div class="live-pill"><div class="dot"></div>FLASK · LOCALHOST:5000</div>
    </div>
  </div>
</header>

<main>{% block content %}{% endblock %}</main>

{% block scripts %}{% endblock %}
</body>
</html>
